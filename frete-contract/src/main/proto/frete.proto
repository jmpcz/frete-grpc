// Contrato gRPC entre checkout-service (cliente) e frete-service (servidor).
syntax = "proto3";

package logistica.frete.v1;

option java_multiple_files = true;
option java_package = "br.ufg.sd.frete.v1";
option java_outer_classname = "FreteProto";

service CotacaoFrete {
  rpc Cotar (CotacaoRequest) returns (CotacaoResponse);
}

enum Modalidade {
  MODALIDADE_NAO_ESPECIFICADA = 0;
  ECONOMICO = 1;
  EXPRESSO  = 2;
  MESMO_DIA = 3;
}

message Pacote {
  int32 peso_gramas    = 1;
  int32 comprimento_cm = 2;
  int32 largura_cm     = 3;
  int32 altura_cm      = 4;
  int64 valor_declarado_centavos = 5;  // base do seguro ad valorem; 0 = sem seguro
}

message CotacaoRequest {
  string     cotacao_id  = 1;  // ecoado na resposta para correlacionar logs
  Pacote     pacote      = 2;
  string     cep_origem  = 3;  // 8 digitos
  string     cep_destino = 4;  // 8 digitos
  Modalidade modalidade  = 5;
}

// Uma linha da composicao do preco, para o total ser rastreavel parcela a parcela.
message ComponenteCusto {
  string descricao      = 1;
  int64  valor_centavos = 2;
}

message CotacaoResponse {
  string cotacao_id           = 1;
  int64  valor_total_centavos = 2;
  int32  prazo_dias_uteis     = 3;
  int32  peso_taxado_gramas   = 4;  // maior entre peso real e peso cubado
  bool   peso_cubado_aplicado = 5;
  repeated ComponenteCusto composicao = 6;
  string versao_tabela = 7;  // para auditoria da cotacao
}
